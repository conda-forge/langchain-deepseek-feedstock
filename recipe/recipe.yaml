context:
  name: langchain-deepseek
  version: "1.2.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langchain_deepseek-${{ version }}.tar.gz
  sha256: 9af0e5e5834368fa6f822b07afe2bb2c7acaa8cfdbe96db0a64794aed6358958

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - langchain-core >=1.8.2,<2.0.0
    - langchain-openai >=1.8.2,<2.0.0

tests:
  - python:
      imports:
        - langchain_deepseek
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: An integration package connecting DeepSeek and LangChain
  license: MIT
  license_file: LICENSE
  repository: https://github.com/langchain-ai/langchain/blob/master/libs/partners/deepseek
  homepage: https://reference.langchain.com/python/integrations/langchain_deepseek/

extra:
  recipe-maintainers:
    - MridulS
